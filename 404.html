<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Страница не найдена | Clean-Truck</title>
    <link
      rel="icon"
      href="./img/icon/logo/main-icon.svg"
      type="image/svg+xml"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #061321;
        color: #fff;
        text-align: center;
        padding: 20px;
      }
      .error-container h1 {
        font-size: 120px;
        color: #00a3ff;
        line-height: 1;
      }
      .error-container h2 {
        font-size: 32px;
        margin: 20px 0 10px;
      }
      .error-container p {
        color: #69778a;
        margin-bottom: 30px;
      }
      .error-container a {
        display: inline-block;
        padding: 14px 40px;
        background: #00a3ff;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.2s;
      }
      .error-container a:hover {
        background: #0088cc;
      }
      @media (max-width: 768px) {
        .error-container h1 {
          font-size: 72px;
        }
        .error-container h2 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <h1>404</h1>
      <h2>Страница не найдена</h2>
      <p>Извините, запрошенная страница не существует или была перемещена.</p>
      <a href="/">Вернуться на главную</a>
    </div>
  </body>
</html>
